<div class="grid">
  <button
    class="btn mb-3 "
    [ngClass]="'btn btn-outline-primary rounded-pill allign-left'"
    (click)="create()">
    Novo
  </button>
</div>

<div class="table-responsive mt-3">

  <app-base-table [data]="data"
                  [columns]="columns"
                  [page]="page"
                  [size]="size"
                  [totalRecords]="totalRecords"
                  (pageChange)="pageChangeEvent($event)"
                  [buttons]="buttons"
                  [hasCheckbox]="true"
                  [filters]="filters"
                  (filtersChange)="onFiltersChange($event)"

  />

  <ngx-spinner
    bdColor="rgba(51,51,51,0.8)"
    size="default"
    color="#fff"
    type="ball-scale-riple"
    [fullScreen] = "true"
  >
    <p style="font-size: 20px; color: white">Loading...</p>
  </ngx-spinner>
</div>
